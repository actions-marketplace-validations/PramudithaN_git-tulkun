name: Update Community Showcase

on:
  schedule:
    # Runs daily at 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  showcase:
    name: Sync Community Pod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover Tulkun Swimmers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update-showcase.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHOWCASE.md scripts/pod-members.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(showcase): update community pod gallery [skip ci]"
            git push
          else
            echo "No changes detected in community pod gallery."
          fi
